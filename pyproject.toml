[project]
name = "evoapi-mcp"
version = "1.2.0"
description = "MCP Server para Evolution API - Envio de mensagens WhatsApp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.1.2,<2",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
pdf = [
    "pypdf>=4.0.0",
    "cryptography>=42.0.0",
]
audio = [
    "faster-whisper>=1.0.0",
]
image = [
    "pypdfium2>=4.30.0",
    "pillow>=10.0.0",
]
bot = [
    "anthropic>=0.70.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
evoapi-mcp = "evoapi_mcp.server:main"
evoapi-mcp-http = "evoapi_mcp.mcp_http:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/evoapi_mcp"]
