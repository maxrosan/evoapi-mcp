[project]
name = "evoapi-mcp"
version = "1.2.0"
description = "MCP Server para Evolution API - Envio de mensagens WhatsApp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.1.2,<2",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # Texto para voz sem chave (vozes do Microsoft Edge). Ver speech.py. É dependência
    # básica, e não extra, porque o Dockerfile do Easypanel tem a lista de extras fixa.
    "edge-tts>=7.0.0",
    # Vetores da memória de longo prazo, com modelo local sem chave. Ver memory.py.
    "fastembed>=0.5.0",
    # OCR do índice de documentos; exige o binário tesseract (apt) no servidor.
    "pytesseract>=0.3.10",
    # Monta o PDF revisado de open_pdf/build_pdf (Python puro). Ver pdfdoc.py.
    "fpdf2>=2.8.0",
]

[project.optional-dependencies]
pdf = [
    "pypdf>=4.0.0",
    "cryptography>=42.0.0",
]
audio = [
    "faster-whisper>=1.0.0",
]
image = [
    "pypdfium2>=4.30.0",
    "pillow>=10.0.0",
]
# Separado de [image] porque, ao contrário de pypdfium2, cairosvg depende da
# libcairo do sistema (apt install libcairo2). Quem instala sem ela recebe um
# recado claro na primeira chamada, em vez de um ImportError na importação.
svg = [
    "cairosvg>=2.7.0",
]
bot = [
    "anthropic>=0.70.0",
]
db = [
    "psycopg[binary,pool]>=3.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
evoapi-mcp = "evoapi_mcp.server:main"
evoapi-mcp-http = "evoapi_mcp.mcp_http:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/evoapi_mcp"]
